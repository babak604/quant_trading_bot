version: '3.8'

services:
  fastapi-intent-parser:
    container_name: agentfi_fastapi_parser
    build: .
    command: python3 -m uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  streamlit-dashboard:
    container_name: agentfi_streamlit_dashboard
    build: .
    command: streamlit run streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"

  swarm-orchestrator:
    container_name: agentfi_swarm_orchestrator
    build: .
    command: python3 swarm_orchestration.py

  dark-pool-matcher:
    container_name: agentfi_dark_pool_matcher
    build: .
    command: python3 -c "import time; print('Dark Pool Matcher active'); time.sleep(3600)"

  zkml-verifier:
    container_name: agentfi_zkml_verifier
    build: .
    command: python3 -c "import time; print('zkML Verifier active'); time.sleep(3600)"
