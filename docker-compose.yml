services:
  fastapi-intent-parser:
    build: .
    container_name: agentfi_fastapi_parser
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app:/app/app
    env_file:
      - .env
    restart: always

  dark-pool-matcher:
    build: .
    container_name: agentfi_dark_pool_matcher
    command: python3 dark_pool_matcher.py
    tty: true
    stdin_open: true
    env_file:
      - .env
    depends_on:
      - fastapi-intent-parser
    restart: always

  zkml-verifier:
    build: .
    container_name: agentfi_zkml_verifier
    command: python3 zkml_proof_verifier.py
    tty: true
    stdin_open: true
    env_file:
      - .env
    depends_on:
      - fastapi-intent-parser
    restart: always

  streamlit-dashboard:
    build: .
    container_name: agentfi_streamlit_dashboard
    command: python3 -m streamlit run dashboard.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    ports:
      - "8501:8501"
    depends_on:
      - fastapi-intent-parser
    restart: always

  nginx-proxy:
    image: nginx:alpine
    container_name: mor_money_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - streamlit-dashboard
      - fastapi-intent-parser
    restart: always
