[package]
name = "quant_trading_bot"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
stylus-sdk = "0.6.0"
alloy-primitives = "0.8.0"
mini-alloc = "0.4.2"

[features]
default = []
export-abi = ["stylus-sdk/export-abi"]

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
codegen-units = 1
strip = true
lto = true
opt-level = "z"
panic = "abort"
